plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Curios
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    // YACL Dependency
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    implementation "dev.isxander:yet-another-config-lib:${yacl_version}-neoforge"

    runtimeOnly "maven.modrinth:jade:${jade_version}+neoforge"

    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

loom {
    runs {
        create("data") {
            clientData()
            programArgs("--all", "--mod", project.rootProject.mod_id)
            programArgs("--output", project(":common").file("src/generated/resources").absolutePath)
            programArgs("--existing", project(":common").file("src/main/resources").absolutePath)
            programArg("datagen")
        }
    }

    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar", Jar), "${rootProject.mod_id}.accesswidener")
    }
}

processResources {
    def props = [
            'mod_id'                   : rootProject.mod_id,
            'mod_name'                 : rootProject.mod_name,
            'version'                  : rootProject.version,
            'description'              : rootProject.mod_description,
            'minecraft_version'        : rootProject.minecraft_version,
            'architectury_api_version' : rootProject.architectury_api_version,
            'geckolib_version'         : rootProject.geckolib_version,
            'yacl_version'             : rootProject.yacl_version,
    ]

    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }

    from(project(":common").sourceSets.main.resources) {
        include "resourcepacks/**"
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null

    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "**/$rootProject.mod_id/datagen/**"
    exclude "assets/$rootProject.mod_id/models/entity/**"
}

assemble.dependsOn shadowJar
