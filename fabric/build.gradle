plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    implementation "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"

    implementation "maven.modrinth:modmenu:${modmenu_version}"

    runtimeOnly "maven.modrinth:jade:${jade_version}+fabric"

    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    injectAccessWidener(tasks.named('jar'))
}

processResources {
    def props = [
            'mod_id'                   : rootProject.mod_id,
            'mod_name'                 : rootProject.mod_name,
            'version'                  : rootProject.version,
            'description'              : rootProject.mod_description,
            'minecraft_version'        : rootProject.minecraft_version,
            'architectury_api_version' : rootProject.architectury_api_version,
            'geckolib_version'         : rootProject.geckolib_version,
            'yacl_version'             : rootProject.yacl_version_short,
    ]

    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }

    from(project(":common").sourceSets.main.resources) {
        include "resourcepacks/**"
        include "${rootProject.mod_id}.accesswidener"
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null

    exclude "architectury.common.json"
    exclude "assets/$rootProject.mod_id/models/entity/**"
}

assemble.dependsOn shadowJar
